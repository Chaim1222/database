name: בדיקת הפניות במכלול לחסרים

# הרצה ידנית בלבד - בודק רק את הכותרות שכבר בדוח "חסר במכלול" (לא
# סורק את מרחב ההפניות של המכלול), ראו check_missing_redirects.py.
# דורש USER_NAME/PASSWORD (בדומה לשלב "שליפת נתוני המכלול" ב-
# weekly_update.yml) כדי להתחבר לחשבון הבוט ולנצל apihighlimits
# (500 כותרות באצווה במקום 50).
on:
  workflow_dispatch:

jobs:
  check_missing_redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקת הפניות במכלול
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python check_missing_redirects.py
