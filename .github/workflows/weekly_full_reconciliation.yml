name: סנכרון שבועי מלא

# מחליף את weekly_update.yml הישן, ולאחר מכן biweekly_full_reconciliation.yml
# - התדירות עברה מדו-שבועית לשבועית (2026-09, על בסיס נתוני reconciliation_
# audit שהראו פערים אמיתיים גם בפרק זמן קצר יחסית - nightly_delta.yml כבר
# מטפל בעדכון השוטף כל לילה, זו רשת הביטחון הנוספת). הריצה הזו היא רשת
# הביטחון: ריקון+מילוי-מלא רגיל, שתופסת את הפערים הידועים שהעדכון המצטבר
# הלילי לא רואה במכוון - בעיקר שינוי סטטוס הפניה<->ערך בלי אירוע יצירה/
# מחיקה/תזוזה נלווה. תחילה מריצה את הדלתא ומקדמת את sync_watermarks
# אחרי התאמה ממוקדת מוצלחת, ואז בונה את הטבלאות הזמניות.
#
# ארכיטקטורת החלפה אטומית עם טבלאות זמניות (ראו mirror_architecture_
# design.md + README.md): הריקון-ומילוי-מחדש קורה על wikipedia_pages_temp/
# mechalol_pages_temp (TARGET_TABLE_SUFFIX=_temp), לא על הטבלאות הפעילות -
# כך שהן ממשיכות לשרת בקשות בלי הפרעה לאורך כל הריצה (יכולה לקחת זמן
# משמעותי). רק בסוף, אחרי שער אימות שמוודא שאין ירידה חשודה במספר השורות,
# ההחלפה עצמה קורית באופן אטומי (רק שינוי שם טבלה - שניות בודדות, לא תלוי
# בכמות השורות). אין חלון rollback - הוסר בכוונה (2026-09, ראו README.md):
# מיד אחרי ההחלפה, מה שהיה פעיל רגע קודם יושב תחת השם הקבוע "_temp".
# weekly_build.py שומר את ההשוואה במסד עם נקודת התקדמות; מיד אחר כך
# מרוקן את הטבלאות הזמניות עם נקודת התקדמות; ורק אז מתבצע סיווג
# התזמון מול הממשקים החיים. כך כשל בסיווג לא משאיר עותק מלא תקוע.
#
# בסיום מוצלח (ההחלפה בפועל קרתה), מפעילה אוטומטית את
# enrichment_after_reconciliation.yml (טריגר workflow_run) - ארבעת
# סקריפטי ההעשרה של דוח "חסר במכלול". הודות ל-forward_fill_enrichment.py
# הוא ירוץ מהר משמעותית כי רוב העמודות כבר "נבדקו" והועברו קדימה.
# resume_after_match נשמר לתאימות: ההמשך נבחר לפי weekly_build_state,
# גם אם הריצה כבר החליפה/שמרה ביקורת/רוקנה את הטבלאות הזמניות.

on:
  schedule:
    - cron: "0 22 * * 6"  # כל מוצאי שבת (שבת -> ראשון), 22:00 UTC = חצות בישראל בחורף
  workflow_dispatch:
    inputs:
      wikipedia_source:
        description: "מקור כותרות ויקיפדיה: dump (ברירת מחדל: דמפ + השלמת פער) או api (סריקת allpages; fallback כשהדמפ לא נגיש, חשוף ל-429)"
        type: choice
        options: [dump, api]
        default: dump
      resume_after_match:
        description: "המשך אחרי ההתאמה: מדלג על השליפות וההתאמה (הטבלאות הזמניות כבר מלאות ומותאמות מריצה שנכשלה בהעברת ההעשרה). לא להפעיל אם הטבלאות הזמניות ריקות או ישנות."
        type: boolean
        default: false

# אותה קבוצת concurrency כמו initial_run.yml/weekly_update.yml/
# nightly_delta.yml - ראו הערה מלאה ב-initial_run.yml. חשוב כאן במיוחד:
# זו הריצה שמבצעת בפועל את הריקון-ומילוי-מחדש (על הטבלאות הזמניות) ואת
# ההחלפה עצמה, כך שהיא הכי רגישה לחפיפה עם ריצה אחרת שנוגעת באותן
# טבלאות.
concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false
  queue: max

jobs:
  full_reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      # The DB checkpoint selects recovery steps. --resume never swaps old data back.
      - name: סנכרון עם נקודות התאוששות
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          WIKIPEDIA_SOURCE: ${{ inputs.wikipedia_source || 'dump' }}
          RESUME_BUILD: ${{ inputs.resume_after_match || false }}
        run: |
          args=(--source "$WIKIPEDIA_SOURCE")
          if [ "$RESUME_BUILD" = "true" ]; then args+=(--resume); fi
          python scripts/weekly_build.py "${args[@]}"

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בסנכרון הדו-שבועי המלא - ${new Date().toISOString().slice(0, 10)}`,
              body: `ריצת הסנכרון הדו-שבועי נכשלה. פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
