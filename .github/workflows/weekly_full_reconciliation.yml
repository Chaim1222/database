name: סנכרון שבועי מלא

# מחליף את weekly_update.yml הישן, ולאחר מכן biweekly_full_reconciliation.yml
# - התדירות עברה מדו-שבועית לשבועית (2026-09, על בסיס נתוני reconciliation_
# audit שהראו פערים אמיתיים גם בפרק זמן קצר יחסית - nightly_delta.yml כבר
# מטפל בעדכון השוטף כל לילה, זו רשת הביטחון הנוספת). הריצה הזו היא רשת
# הביטחון: ריקון+מילוי-מלא רגיל, שתופסת את הפערים הידועים שהעדכון המצטבר
# הלילי לא רואה במכוון - בעיקר שינוי סטטוס הפניה<->ערך בלי אירוע יצירה/
# מחיקה/תזוזה נלווה. לא נוגעת ב-sync_watermarks בכלל - זו נשארת באחריות
# nightly_delta.yml בלבד, שתי המסלולים בלתי תלויים אחד בשני.
#
# ארכיטקטורת החלפה אטומית עם טבלאות זמניות (ראו mirror_architecture_
# design.md + README.md): הריקון-ומילוי-מחדש קורה על wikipedia_pages_temp/
# mechalol_pages_temp (TARGET_TABLE_SUFFIX=_temp), לא על הטבלאות הפעילות -
# כך שהן ממשיכות לשרת בקשות בלי הפרעה לאורך כל הריצה (יכולה לקחת זמן
# משמעותי). רק בסוף, אחרי שער אימות שמוודא שאין ירידה חשודה במספר השורות,
# ההחלפה עצמה קורית באופן אטומי (רק שינוי שם טבלה - שניות בודדות, לא תלוי
# בכמות השורות). אין חלון rollback - הוסר בכוונה (2026-09, ראו README.md):
# מיד אחרי ההחלפה, מה שהיה פעיל רגע קודם יושב תחת השם הקבוע "_temp".
# קודם log_reconciliation_diff.py שומר את ההשוואה במסד; מיד אחר כך
# truncate_temp_pages.py מרוקן את הטבלאות הזמניות; ורק אז מתבצע סיווג
# התזמון מול הממשקים החיים. כך כשל בסיווג לא משאיר עותק מלא תקוע.
#
# בסיום מוצלח (ההחלפה בפועל קרתה), מפעילה אוטומטית את
# enrichment_after_reconciliation.yml (טריגר workflow_run) - ארבעת
# סקריפטי ההעשרה של דוח "חסר במכלול". הודות ל-forward_fill_enrichment.py
# למטה, הוא ירוץ מהר משמעותית כי רוב העמודות כבר "נבדקו" והועברו קדימה.

on:
  schedule:
    - cron: "0 22 * * 6"  # כל מוצאי שבת (שבת -> ראשון), 22:00 UTC = חצות בישראל בחורף
  workflow_dispatch:

# אותה קבוצת concurrency כמו initial_run.yml/weekly_update.yml/
# nightly_delta.yml - ראו הערה מלאה ב-initial_run.yml. חשוב כאן במיוחד:
# זו הריצה שמבצעת בפועל את הריקון-ומילוי-מחדש (על הטבלאות הזמניות) ואת
# ההחלפה עצמה, כך שהיא הכי רגישה לחפיפה עם ריצה אחרת שנוגעת באותן
# טבלאות.
concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  full_reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      issues: write
    # הפלט should_swap מגיע מצעד "שער אימות" למטה - "true" אם ניתן
    # להחליף, "false" אם התגלתה ירידה (חמורה או קלה) במספר השורות.
    outputs:
      should_swap: ${{ steps.validate.outputs.should_swap }}
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      # fetch_wikipedia.py *חייב* לרוץ לפני fetch_mechalol.py - גם על
      # הטבלאות הזמניות, מאותה סיבה בדיוק כמו על הטבלאות הפעילות (ראו
      # postmortem 2026-09 ב-schema.sql): הריקון (truncate_temp_pages,
      # רשת ביטחון בלבד - הטבלאות כבר אמורות להיות ריקות מסוף הסבב
      # הקודם) חייב לקרות לפני מילוי mechalol_pages_temp, לא אחריו.
      - name: שליפת כותרות ויקיפדיה לטבלה הזמנית
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_TABLE_SUFFIX: "_temp"
        run: python scripts/fetch_wikipedia.py

      - name: שליפת נתוני המכלול לטבלה הזמנית
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TARGET_TABLE_SUFFIX: "_temp"
        run: python scripts/fetch_mechalol.py

      - name: התאמה מלאה על הטבלה הזמנית
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TARGET_TABLE_SUFFIX: "_temp"
        run: python scripts/match.py --login

      - name: העברת העשרה קדימה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/forward_fill_enrichment.py

      - name: שער אימות
        id: validate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/validate_before_swap.py

      # רץ רק אם שער האימות אישר (should_swap=true). ירידה קלה (מתחת
      # לסף) לא חוסמת - רק מתועדת בלוג. ירידה חמורה כבר עצרה את ה-job
      # קודם (validate_before_swap.py יוצא עם קוד 1 ונפתח Issue), אז
      # הצעד הזה כלל לא מגיע אליו.
      - name: החלפה אטומית
        if: steps.validate.outputs.should_swap == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/swap_temp_to_active.py

      # רק אחרי החלפה אטומית שבאמת קרתה. בשלב הזה נשמרת ההשוואה
      # עצמה במסד, אבל עדיין לא מתבצע הסיווג מול הממשקים החיים.
      # אם השמירה נכשלת, הצעד נכשל והריקון שאחריו לא ירוץ - כדי לא
      # לאבד את המצב הקודם לפני שהפערים נשמרו.
      - name: שמירת פערי פיוס
        id: reconciliation_audit
        if: steps.validate.outputs.should_swap == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/log_reconciliation_diff.py --record-only

      # ברגע שההשוואה נשמרה, אין עוד צורך בטבלאות הזמניות לצורך
      # הסיווג. מרוקנים אותן מיד, לפני כל קריאת רשת נוספת, כדי שכשל
      # מאוחר יותר לא ישאיר מאות אלפי שורות כפולות עד הסבב הבא.
      - name: ריקון הטבלה הזמנית
        if: steps.validate.outputs.should_swap == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/truncate_temp_pages.py

      # הסיווג משתמש רק בביקורת שכבר נשמרה ובממשקים החיים; הוא לא
      # תלוי יותר בטבלאות הזמניות. אם הוא נכשל, הריצה תסומן ככשל אבל
      # האחסון כבר נוקה, ואפשר להשלים ידנית עם אותו audit_id.
      - name: סיווג פערי פיוס
        if: steps.validate.outputs.should_swap == 'true' && steps.reconciliation_audit.outputs.audit_id != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/log_reconciliation_diff.py --classify-only "${{ steps.reconciliation_audit.outputs.audit_id }}"

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בסנכרון הדו-שבועי המלא - ${new Date().toISOString().slice(0, 10)}`,
              body: `ריצת הסנכרון הדו-שבועי נכשלה. פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
