name: שליפת תאריכי יצירה לחסרים

# הרצה ידנית בלבד - שולף תאריך יצירה רק לכותרות שכבר בדוח "חסר
# במכלול", ראו fetch_wikipedia_created_at.py. בקשה אחת לכל כותרת
# (מגבלה מוצהרת של API ויקיפדיה - לא ניתן לבקש בבת אחת לכמה דפים),
# אז זה יכול לקחת זמן עם הרבה כותרות - timeout גבוה יחסית ליתר ביטחון.
# לא דורש USER_NAME/PASSWORD - ריצה אנונימית מול ויקיפדיה, בלי צורך
# בהתחברות (המגבלה כאן מבנית, לא תלוית-הרשאות).
on:
  workflow_dispatch:

jobs:
  fetch_wikipedia_created_at:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: שליפת תאריכי יצירה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia_created_at.py
