name: עדכון מצטבר לילי

on:
  schedule:
    - cron: "0 2 * * *"  # כל לילה ב-02:00 UTC
  workflow_dispatch:

# אותה קבוצת concurrency כמו initial_run.yml/weekly_update.yml/
# biweekly_full_reconciliation.yml - ראו הערה מלאה ב-initial_run.yml.
# nightly_delta.yml עצמו לא מרוקן טבלאות, אבל כותב (upsert/delete ממוקד)
# לאותן טבלאות בדיוק שהסנכרון הדו-שבועי מרוקן ומדביק חזרה - בלי התור
# המשותף, לילה שבו הסנכרון עדיין רץ (חורג מעבר לחלון שלו) עלול להתנגש
# עם ריקון שקורה באמצע. אם ריצה של nightly_delta נשארת בתור מאחורי
# ריצה ארוכה, היא פשוט תרוץ מאוחר יותר - לא מדלגת, בזכות
# sync_watermarks שממשיך מאיפה שהפסיק.
concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  delta_update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      # כמו בריצה המלאה (weekly_update.yml/biweekly_full_reconciliation.yml) -
      # מכלול קודם לוויקיפדיה. כאן זה כבר לא תלות קשיחה (apply_deletions
      # ב-fetch_wikipedia_delta.py משחרר בעצמו wikipedia_id לפני מחיקה -
      # ראו ההערה שם) - נשמר לעקביות ולניטור, לא לדרישה טכנית.
      - name: עדכון מצטבר - מכלול
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_mechalol_delta.py

      - name: עדכון מצטבר - ויקיפדיה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia_delta.py

      # --scoped: בודק רק שורות מכלול שהעדכון המצטבר הזה נגע בהן (ישירות, או
      # דרך wikipedia_id שהצביע לדף שהשתנה) - לא סריקה מלאה. קורא את
      # קבצי ה-changed_ids.json שנכתבו על ידי שני השלבים למעלה, באותו
      # workspace (אותו job - הקבצים נשארים על הדיסק בין הצעדים).
      - name: התאמה ממוקדת
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python match.py --scoped --login

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בעדכון המצטבר הלילי - ${new Date().toISOString().slice(0, 10)}`,
              body: `ריצת העדכון המצטבר הלילי נכשלה. פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
