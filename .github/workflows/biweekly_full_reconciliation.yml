name: סנכרון דו-שבועי מלא

# מחליף את weekly_update.yml הישן - התדירות עברה לדו-שבועית (במקור
# הייתה חודשית, שונה ב-2026-08 - nightly_delta.yml כבר מטפל בעדכון
# השוטף כל לילה, ואין סיבה שרשת הביטחון תחכה חודש שלם). הריצה הזו
# היא רשת הביטחון: ריקון+מילוי-מלא רגיל (בדיוק כמו שהיה קודם, אין
# שינוי בסקריפטים עצמם), שתופסת את הפערים הידועים שהעדכון המצטבר הלילי לא רואה
# במכוון - בעיקר שינוי סטטוס הפניה<->ערך בלי אירוע יצירה/מחיקה/תזוזה
# נלווה. לא נוגעת ב-sync_watermarks בכלל - זו נשארת באחריות
# nightly_delta.yml בלבד, שתי המסלולים בלתי תלויים אחד בשני.
#
# בסיום מוצלח, מפעילה אוטומטית את enrichment_after_reconciliation.yml
# (טריגר workflow_run) - ארבעת סקריפטי ההעשרה של דוח "חסר במכלול"
# (תיאורי ויקינתונים, קלות ייבוא, תאריכי יצירה, הפניות במכלול).
#
# מחליפים את weekly_update.yml הישן בקובץ הזה (מוחקים את הישן, לא
# משאירים את שניהם רצים).

on:
  schedule:
    - cron: "0 3 1,15 * *"  # ה-1 וה-15 לכל חודש, 03:00 UTC
  workflow_dispatch:

# אותה קבוצת concurrency כמו initial_run.yml/weekly_update.yml/
# nightly_delta.yml - ראו הערה מלאה ב-initial_run.yml. חשוב כאן במיוחד:
# זו הריצה שמבצעת בפועל את הריקון-ומילוי-מחדש (fetch_mechalol.py,
# fetch_wikipedia.py), כך שהיא הכי רגישה לחפיפה עם ריצה אחרת שנוגעת
# באותן טבלאות.
concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  full_reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      # fetch_wikipedia.py *חייב* לרוץ לפני fetch_mechalol.py - טעות
      # בסדר ההפוך גרמה בעבר לאובדן נתונים אמיתי: truncate_wikipedia_pages()
      # רץ עם CASCADE בפועל (ראו schema.sql ו-2026-09 postmortem) - כל
      # TRUNCATE על wikipedia_pages, עם CASCADE, מרוקן גם את mechalol_pages
      # *לגמרי* (כל הטבלה, לא רק שורות עם מפתח זר תלוי) - ללא קשר לערכי
      # wikipedia_id ולסדר הצעדים. לכן mechalol_pages *חייב* להתמלא
      # אחרי הריקון הזה, לא לפניו.
      - name: שליפת כותרות ויקיפדיה (מלא)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia.py

      - name: שליפת נתוני המכלול (מלא)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python fetch_mechalol.py

      - name: התאמה מלאה בין הכותרות
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python match.py --login

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בסנכרון הדו-שבועי המלא - ${new Date().toISOString().slice(0, 10)}`,
              body: `ריצת הסנכרון הדו-שבועי נכשלה. פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
