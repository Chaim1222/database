name: עדכון שבועי

on:
  schedule:
    - cron: "0 3 * * 0"  # כל יום ראשון ב-03:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: שחזור נקודת הבדיקה הקודמת של מחיקות
        uses: actions/cache@v4
        with:
          path: deletion_check_progress.json
          key: deletion-check-progress-${{ github.run_id }}
          restore-keys: |
            deletion-check-progress-

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: שליפת כותרות ויקיפדיה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia.py

      - name: שליפת נתוני המכלול
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MECHALOL_API_URL: ${{ secrets.MECHALOL_API_URL }}
        run: python fetch_mechalol.py

      - name: התאמה בין הכותרות
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python match.py

      - name: בדיקת מחיקות/העברות מוויקיפדיה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_wikipedia_deletions.py

      - name: שמירת נקודת הבדיקה הנוכחית
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deletion_check_progress.json
          key: deletion-check-progress-${{ github.run_id }}
