name: עדכון שבועי

on:
  schedule:
    - cron: "0 3 * * 0"  # כל יום ראשון ב-03:00 UTC
  workflow_dispatch:

# אותה קבוצת concurrency כמו initial_run.yml/biweekly_full_reconciliation.yml/
# nightly_delta.yml - ראו הערה שם. חשוב גם כאן, למרות שה-workflow מושבת
# כרגע, ליום שבו מישהו יפעיל אותו ידנית.
concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: שליפת נתוני המכלול
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python fetch_mechalol.py

      # fetch_mechalol.py *חייב* לרוץ לפני fetch_wikipedia.py - ראו
      # ההערה המפורטת בראש כל אחד מהקבצים (מפתח זר
      # mechalol_pages.wikipedia_id -> wikipedia_pages.id; ריקון
      # wikipedia_pages דורש שכל ה-wikipedia_id ב-mechalol_pages כבר
      # NULL, מובטח רק מיד אחרי ריקון+מילוי טרי של mechalol_pages).
      - name: שליפת כותרות ויקיפדיה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia.py

      - name: התאמה בין הכותרות
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python match.py

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בעדכון השבועי - ${new Date().toISOString().slice(0, 10)}`,
              body: `ריצת העדכון השבועי נכשלה. פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
