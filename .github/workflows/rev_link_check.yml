name: בדיקת קישורים מול גרסת המקור

# סורק את כל ערכי המכלול בהיקף עם `גרסה=` ובודק שהקישור לוויקיפדיה (wikipedia_id) תואם לדף
# שהגרסה שייכת לו. שורות חריגות נכתבות ל-rev_link_check (ראו migrations/migration_add_rev_link_check.sql,
# שחייבת לרוץ לפני) ומוצגות ב-report_rev_link_mismatch. לא נוגע בטבלאות הערכים.
# הרצה ידנית. dry_run: סיכום בלבד, בלי כתיבה (עובד גם לפני המיגרציה).
#
# קבוצת ה-concurrency זהה לשאר ה-workflows שכותבים למסד, כדי לא לרוץ בזמן החלפת הטבלאות.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "סיכום בלבד, בלי כתיבה ל-rev_link_check"
        default: true
        type: boolean
      max_minutes:
        description: "תקציב זמן (דקות)"
        default: "150"
        type: string

concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקות
        run: python -m unittest discover -s scripts/tests

      - name: בדיקת הקישורים
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_rev_links.py --max-minutes ${{ inputs.max_minutes }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בבדיקת קישורים מול גרסת המקור - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
