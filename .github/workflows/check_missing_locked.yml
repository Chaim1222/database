name: בדיקת כותרות חסרות נעולות

# הרצה חודשית אוטומטית (ה-1 לכל חודש, 04:00 UTC - אחרי חלון העדכון
# השבועי הרגיל), בנפרד לגמרי מ-weekly_update.yml. workflow_dispatch
# עדיין זמין גם להרצה ידנית לפי הצורך.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  check_locked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקת נעילה ועדכון הרשימה השחורה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_missing_locked.py
