name: בדיקת כותרות חסרות נעולות

# מ-2026-09: אין יותר תזמון אוטומטי עצמאי כאן - הבדיקה רצה כעבודה
# מקבילה בתוך enrichment_after_reconciliation.yml, אחרי כל "סנכרון
# שבועי מלא" מוצלח (תזמון עצמאי נפרד הפך למיותר ברגע שזה קורה שם
# ממילא, ולעיתים קרובות יותר - שבועי במקום חודשי). הקובץ הזה נשאר
# רק ל-workflow_dispatch - הרצה ידנית של הבדיקה הזו בלבד, בלי להריץ
# את שאר ארבע עבודות ההעשרה יחד איתה.
on:
  workflow_dispatch:

jobs:
  check_locked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקת נעילה ועדכון הרשימה השחורה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/check_missing_locked.py
