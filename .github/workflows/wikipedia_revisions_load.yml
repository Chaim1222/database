name: טעינת גרסאות ויקיפדיה העדכניות

# ממלא wikipedia_pages.latest_rev_id/latest_rev_ts ומחשב mechalol_pages.source_state
# (current / ahead). הרצה ידנית בלבד.
#
# dump: מוריד את hewiki-latest-stub-meta-current.xml.gz ישירות מ-dumps.wikimedia.org לתוך
#       הריצה (בזרימה, בלי לשמור קובץ ובלי להעלות לריפו), ומשלים את הפער מ-recentchanges.
# api:  fallback אם הדמפ לא נגיש. שעתיים עד שלוש, בקצב מתון.
#
# קבוצת ה-concurrency זהה לשאר ה-workflows שנוגעים בטבלאות: לא רץ בזמן דלתא או סנכרון שבועי.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "מקור הנתונים"
        type: choice
        options: [dump, api]
        default: dump
      max_minutes:
        description: "מצב api: תקציב זמן (דקות) לפני עצירה מסודרת"
        default: "300"
        type: string

concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקות
        run: python -m unittest discover -s scripts/tests

      - name: טעינת גרסאות
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia_revisions.py --mode ${{ inputs.mode }} --max-minutes ${{ inputs.max_minutes }}

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בטעינת גרסאות ויקיפדיה (${{ inputs.mode }}) - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
