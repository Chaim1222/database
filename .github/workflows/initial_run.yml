name: הרצה ראשונית - איסוף מלא

# מופעל ידנית בלבד.
# ניתן לבחור אם להריץ הכול, רק את המכלול, או רק את שלב ההתאמה.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "מה להריץ?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mechalol_only
          - match_only
      skip_template_check:
        description: "התאמה: לדלג על בדיקת תבנית מיון (כשהמכלול לא זמין, למשל 'מצב התקפה')"
        required: false
        default: false
        type: boolean
      login:
        description: "התאמה: להתחבר לחשבון הבוט במכלול (USER_NAME/PASSWORD) לפני בדיקת תבנית המיון"
        required: false
        default: false
        type: boolean

# concurrency משותפת עם שאר ה-workflows שנוגעים בטבלאות wikipedia_pages/
# mechalol_pages (initial_run.yml, weekly_update.yml,
# biweekly_full_reconciliation.yml, nightly_delta.yml) - מונעת ריצות
# חופפות שמריקות/כותבות זו על זו (בדיוק התקלה שגרמה בעבר ל-mechalol_pages
# להימצא ריקה אחרי weekly_update.yml + initial_run.yml חופפים).
# cancel-in-progress: false בכוונה - עדיף לחכות בתור מאשר לבטל ריצה
# באמצע ריקון ולהשאיר את הטבלה חצי-ריקה.
concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: שחזור קובצי התקדמות קודמים
        if: ${{ inputs.mode != 'match_only' }}
        uses: actions/cache@v4
        with:
          path: |
            wikipedia_progress.json
            mechalol_progress.json
          key: import-progress-${{ github.run_id }}
          restore-keys: |
            import-progress-

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      # fetch_wikipedia.py *חייב* לרוץ לפני fetch_mechalol.py, גם כאן -
      # טעות בסדר ההפוך גרמה בעבר לאובדן נתונים אמיתי:
      # truncate_wikipedia_pages() רץ עם CASCADE בפועל (ראו schema.sql
      # ו-2026-09 postmortem) - כל TRUNCATE על wikipedia_pages, עם
      # CASCADE, מרוקן גם את mechalol_pages *לגמרי* (כל הטבלה, לא רק
      # שורות עם מפתח זר תלוי) - ללא קשר לערכי wikipedia_id ולסדר
      # הצעדים. לכן mechalol_pages *חייב* להתמלא אחרי הריקון הזה, לא
      # לפניו. לא רלוונטי במצב mechalol_only (אין ריקון ויקיפדיה בכלל).
      - name: שליפת כותרות ויקיפדיה
        if: ${{ inputs.mode == 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia.py

      - name: שליפת נתוני המכלול
        if: ${{ inputs.mode == 'all' || inputs.mode == 'mechalol_only' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python fetch_mechalol.py

      - name: התאמה בין הכותרות
        if: ${{ inputs.mode == 'match_only' || (inputs.mode == 'all' && success()) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: >
          python match.py
          ${{ inputs.skip_template_check == true && '--skip-template-check' || '' }}
          ${{ inputs.login == true && '--login' || '' }}

      - name: שמירת התקדמות (אם הריצה נעצרה באמצע)
        if: ${{ always() && inputs.mode != 'match_only' }}
        uses: actions/cache/save@v4
        with:
          path: |
            wikipedia_progress.json
            mechalol_progress.json
          key: import-progress-${{ github.run_id }}
