name: העשרת דוח "חסר במכלול"

# מאחד חמישה סקריפטים שהיו workflow נפרד וידני-בלבד כל אחד (שליפת
# תיאורי ויקינתונים, חישוב קלות ייבוא, שליפת תאריכי יצירה, בדיקת
# הפניות במכלול, ומ-2026-09 גם בדיקת כותרות חסרות נעולות - הוחלף
# מ-check_missing_locked.yml, ששם נשאר רק ל-workflow_dispatch ידני
# בלי תזמון אוטומטי עצמאי, שהיה מיותר ברגע שזה רץ כאן) - כולם מעשירים
# אך ורק שורות שכבר בדוח report_missing_from_mechalol, ולא היו חלק
# מהריצה הראשית.
#
# מופעל אוטומטית מיד אחרי סיום מוצלח של "סנכרון שבועי מלא"
# (weekly_full_reconciliation.yml, לשעבר biweekly - שונה תדירות
# ותזמון ב-2026-09) - זה הרגע שבו דוח "חסר במכלול" הכי טרי, אחרי
# ריקון+מילוי+התאמה מלאים. אם שם ה-workflow המקורי ישתנה אי-פעם, יש
# לעדכן את הרשימה תחת workflows: למטה בהתאם.
#
# חמש העבודות למטה רצות *מקבילות זו לזו*, לא ברצף - במכוון, כי
# "שליפת תאריכי יצירה" יכולה לקחת עד כמה שעות (בקשה אחת לכל כותרת,
# מגבלה מבנית של API ויקיפדיה - אין דרך לבקש כמה דפים בבת אחת). הרצה
# ברצף הייתה גוררת את שאר ארבע העבודות הקצרות בהרבה לחכות לה סתם.
# כל עבודה נכשלת/מצליחה בנפרד; כישלון באחת לא עוצר את האחרות.
#
# workflow_dispatch מריץ את כל חמש העבודות ביחד לצורך בדיקה ידנית -
# אין הבחנה בין הרצה אוטומטית לידנית מבחינת אילו עבודות רצות.

on:
  workflow_run:
    workflows: ["סנכרון שבועי מלא"]
    types: [completed]
  workflow_dispatch:

jobs:
  wikidata_descriptions:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: שליפת תיאורי ויקינתונים
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikidata_descriptions.py

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בשליפת תיאורי ויקינתונים - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });

  easy_import_candidates:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: חישוב קלות ייבוא
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_easy_import_candidates.py

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בחישוב קלות ייבוא - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });

  wikipedia_created_at:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: שליפת תאריכי יצירה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_wikipedia_created_at.py

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בשליפת תאריכי יצירה - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });

  missing_redirects:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקת הפניות במכלול
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python check_missing_redirects.py

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בבדיקת הפניות במכלול - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });

  check_missing_locked:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקת נעילה ועדכון הרשימה השחורה
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_missing_locked.py

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל בבדיקת כותרות חסרות נעולות - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
