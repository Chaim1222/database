name: מילוי משימות גרסה (rev_task)

# מילוי ראשוני של rev_task / rev_page_id / rev_page_title בטבלה הפעילה (scripts/backfill_rev_task.py):
# לכל ערך מתועד עם `גרסה=` שואל את ה-API לאיזה דף הגרסה שייכת, ומחליט לפי scripts/rev_match.py.
# כותב רק שורות ששונו, ולא נוגע בקישורים (wikipedia_id): הם יתעדכנו בריצת match.py הבאה.
# אחרי המילוי match.py (השבועי והדלתא) מתחזק את העמודות בעצמו.
#
# חייבת לרוץ אחרי migrations/migration_add_rev_task.sql. הרצה ידנית. dry_run: בלי כתיבה, שורה בלוג לכל
# שינוי (עדיין דורש את המיגרציה, כי הסקריפט קורא את העמודות).
# קבוצת ה-concurrency זהה לשאר ה-workflows שכותבים למסד, כדי לא לרוץ בזמן החלפת הטבלאות.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "בלי כתיבה למסד: סיכום ושורה לכל שינוי"
        default: true
        type: boolean
      max_minutes:
        description: "תקציב זמן (דקות)"
        default: "150"
        type: string

concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      issues: write
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: בדיקות
        run: python -m unittest discover -s scripts/tests

      - name: מילוי משימות הגרסה
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          args="--max-minutes $MAX_MINUTES"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python backfill_rev_task.py $args

      - name: פתיחת Issue בעת כישלון
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `כשל במילוי משימות גרסה - ${new Date().toISOString().slice(0, 10)}`,
              body: `פרטי הריצה: ${runUrl}`,
              labels: ["automation-failure"],
            });
