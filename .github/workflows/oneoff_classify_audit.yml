name: השלמת סיווג ביקורת (חד-פעמי)

# ────────────────────────────────────────────────────────────────────────
# workflow זמני וחד-פעמי. מטרתו היחידה: להשלים את שלב הסיווג
# (classify_timing) עבור שורת reconciliation_audit שכבר נוצרה בהצלחה,
# אבל שלב הסיווג שלה נכשל באמצע (למשל ריצת הסנכרון השבועי מ-2026-09-13,
# audit_id=3, שנפלה על invalidparammix ב-fetch_latest_revision_timestamps).
#
# הוא מריץ:  python scripts/log_reconciliation_diff.py --classify-only <audit_id>
# הדגל מדלג לגמרי על קריאת ה-RPC log_reconciliation_diff() - כלומר *לא*
# נוצרת ביקורת חדשה, *לא* מתבצע swap, ו-sync_watermarks / הטבלה הזמנית
# לא נוגעים בהם כלל. רק שורות reconciliation_audit_details הקיימות של
# אותה ביקורת מסווגות (is_timing_only / source_latest_edit_at), ובסוף
# untracked_changes_genuine מתעדכן בשורת הביקורת. classify_timing
# אידמפוטנטית - בטוח להריץ שוב אם ייכשל באמצע.
#
# הפעלה: לשונית Actions במאגר -> "השלמת סיווג ביקורת (חד-פעמי)" ->
# Run workflow -> להזין את מספר הביקורת (audit_id) -> Run.
#
# אחרי שהריצה הצליחה: למחוק את הקובץ הזה (הוא נועד לשימוש חד-פעמי בלבד).
# אין בו schedule - הוא לעולם לא ירוץ מעצמו, רק בלחיצה ידנית.
# ────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: "מספר הביקורת להשלמת סיווג (audit_id, למשל 3)"
        required: true
        type: string

# אותה קבוצת concurrency כמו שאר ה-workflows שכותבים ל-DB, כדי למנוע
# חפיפה עם ריצת סנכרון שרצה במקביל (ראו ההערה ב-weekly_full_reconciliation.yml).
concurrency:
  group: mechalol-wikipedia-db-write
  cancel-in-progress: false

jobs:
  classify_only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: שחזור קוד
        uses: actions/checkout@v4

      - name: התקנת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות
        run: pip install -r requirements.txt

      - name: השלמת סיווג הביקורת
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/log_reconciliation_diff.py --classify-only "${{ inputs.audit_id }}"
