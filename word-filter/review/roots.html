<title>סידור המילים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
	--bg: #f3f4f1; --panel: #ffffff; --ink: #1d2422; --muted: #5f6b67; --line: #d9ddd7; --soft: #e9ece7;
	--accent: #1f5f57; --accent-soft: #d8e9e5;
	--bad: #a3242b; --bad-soft: #f6dedd; --ok: #2f7550; --ok-soft: #dcefe3; --mid: #9a6a00; --mid-soft: #f7ebcc;
	--grey: #6d7270; --grey-soft: #e4e6e4;
	--p: #b33a2f; --i: #3f7f5a; --u: #a9a9a0;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #151a19; --panel: #1d2422; --ink: #e8ece9; --muted: #9aa6a1; --line: #323b38; --soft: #26302d;
		--accent: #6cc3b4; --accent-soft: #1f3a36;
		--bad: #ef8a86; --bad-soft: #3d2324; --ok: #7cc49a; --ok-soft: #1f3528; --mid: #e2b64f; --mid-soft: #3a3120;
		--grey: #a4aaa7; --grey-soft: #2b302e; --p: #ef8a7c; --i: #7cc49a; --u: #6d726f;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #151a19; --panel: #1d2422; --ink: #e8ece9; --muted: #9aa6a1; --line: #323b38; --soft: #26302d;
	--accent: #6cc3b4; --accent-soft: #1f3a36;
	--bad: #ef8a86; --bad-soft: #3d2324; --ok: #7cc49a; --ok-soft: #1f3528; --mid: #e2b64f; --mid-soft: #3a3120;
	--grey: #a4aaa7; --grey-soft: #2b302e; --p: #ef8a7c; --i: #7cc49a; --u: #6d726f;
	color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); direction: rtl; margin: 0; font: 15px/1.55 "Heebo", "Arial Hebrew", Arial, sans-serif; padding-inline: 16px; padding-block: 20px 60px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: "Frank Ruhl Libre", "Times New Roman", serif; font-size: 30px; margin: 0; }
.intro { color: var(--muted); margin: 4px 0 0; max-width: 72ch; }
.status { font-size: 13px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 230px 1fr; gap: 18px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
nav { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - 30px); overflow: auto; }
@media (max-width: 820px) { nav { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; } }
nav button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 7px; font-size: 14px; }
@media (max-width: 820px) { nav button { width: auto; border: 1px solid var(--line); } }
nav button:hover { background: var(--soft); }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
nav button:focus-visible { outline: 2px solid var(--accent); }
nav .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
nav .cnt.done { color: var(--ok); font-weight: 700; }
main { display: grid; gap: 14px; min-width: 0; }
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.block h2 { font-family: "Frank Ruhl Libre", serif; margin: 0; font-size: 24px; }
.block h3 { margin: 0; font-size: 17px; }
.q { display: flex; gap: 10px; align-items: baseline; }
.q .n { font-family: "Frank Ruhl Libre", serif; font-size: 22px; color: var(--accent); line-height: 1; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0; }
textarea, input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; }
textarea { min-height: 38px; resize: vertical; }
.opt { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.opt[aria-pressed="true"].bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); font-weight: 700; }
.opt[aria-pressed="true"].ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); font-weight: 700; }
.opt[aria-pressed="true"].mid { background: var(--mid-soft); color: var(--mid); border-color: var(--mid); font-weight: 700; }
.opt[aria-pressed="true"].grey { background: var(--grey-soft); color: var(--grey); border-color: var(--grey); font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 5px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: start; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px; border-bottom: 1px solid var(--soft); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; text-align: center; color: var(--muted); white-space: nowrap; }
td.num b { color: var(--ink); font-weight: 500; }
td.phrase { font-weight: 500; min-width: 140px; }
tr.decided td.phrase::after { content: " ✓"; color: var(--ok); }
.more { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.ex { display: grid; gap: 3px; margin-top: 4px; font-size: 13px; font-weight: 400; }
.ex div { padding: 2px 8px; border-inline-start: 3px solid var(--line); background: var(--bg); border-radius: 0 5px 5px 0; overflow-wrap: anywhere; }
.ex div.p { border-color: var(--p); } .ex div.i { border-color: var(--i); } .ex div.u { border-color: var(--u); }
.ex mark { background: var(--mid-soft); color: inherit; font-weight: 700; padding: 0 1px; border-radius: 3px; }
.ex .t { color: var(--muted); font-size: 12px; }
.word { border-top: 1px solid var(--soft); padding-top: 10px; display: grid; gap: 6px; }
.word:first-of-type { border-top: 0; padding-top: 0; }
.wtop { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.wname { font-size: 17px; font-weight: 700; }
.wname small { font-weight: 400; color: var(--muted); font-size: 12px; font-family: "IBM Plex Mono", monospace; }
.bar { display: inline-flex; height: 8px; width: 120px; border-radius: 4px; overflow: hidden; background: var(--soft); vertical-align: middle; margin-inline-start: 6px; }
.bar span { display: block; height: 100%; }
.facts { font-size: 13px; color: var(--muted); }
.sugg { font-size: 13px; }
.sugg b { font-weight: 500; }
.anchors { display: flex; flex-wrap: wrap; gap: 6px; }
.anc { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 8px; font-size: 14px; }
.anc.off { opacity: .55; text-decoration: line-through; }
.anc button { font: inherit; font-size: 12px; border: 0; background: var(--soft); color: var(--muted); border-radius: 6px; padding: 1px 6px; cursor: pointer; }
.pat { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; direction: ltr; unicode-bidi: plaintext; overflow-wrap: anywhere; color: var(--muted); }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.done-bar { font-size: 13px; color: var(--muted); }
</style>

<div class="wrap">
	<header>
		<h1>סידור המילים</h1>
		<p class="intro">בכל שורש יש שלוש שאלות. אחרי שתענה עליהן, אכתוב את הרשימות מחדש: כפילויות אאחד, ואת התבניות אבנה בעצמי.</p>
		<p class="status" id="status">טוען…</p>
	</header>
	<div class="layout">
		<nav id="nav" aria-label="שורשים"></nav>
		<main id="main"><p class="empty">טוען את הנתונים…</p></main>
	</div>
</div>

<script>
(function () {
	var data = null, db = null, current = null;
	var choices = {}, phraseChoices = {}, rootNotes = {};
	var WORD_OPTS = [['general', 'לבדיקה, לפי ההקשר', 'mid'], ['fixed', 'לבדיקה, קבוע', 'mid'], ['anchor', 'בעיה תמיד', 'bad'], ['drop', 'להוריד', 'grey']];
	var OTHER_OPTS = [['wording', 'הערת ניסוח', 'mid'], ['names', 'שמות הקודש', 'mid'], ['anchor', 'בעיה תמיד', 'bad'], ['general', 'לבדיקה', 'mid'], ['drop', 'להוריד', 'grey']];
	var LABEL = { anchor: 'בעיה תמיד', general: 'לבדיקה, לפי ההקשר', fixed: 'לבדיקה, קבוע', wording: 'הערת ניסוח', names: 'שמות הקודש', drop: 'להוריד', merge: 'לאחד' };

	function el(tag, attrs, kids) {
		var e = document.createElement(tag);
		if (attrs) for (var k in attrs) {
			if (k === 'text') e.textContent = attrs[k];
			else if (k === 'class') e.className = attrs[k];
			else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
			else e.setAttribute(k, attrs[k]);
		}
		(kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
		return e;
	}
	function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
	function pid(rootId, text) { return rootId + '~' + hash(text); }
	function sugg(e) { return e.role.indexOf('merge:') === 0 ? 'merge' : e.role; }
	function roleOf(e) { return choices[e.id] ? choices[e.id].role : null; }
	function isWord(e) { var s = sugg(e); return s === 'general' || s === 'fixed'; }
	function isModesty(r) { return r.topic === 'modesty'; }

	function progress(r) {
		var n = 0, t = r.entries.length + r.phrases.length;
		r.entries.forEach(function (e) { if (choices[e.id]) n++; });
		r.phrases.forEach(function (p) { if (phraseChoices[pid(r.id, p.text)]) n++; });
		return [n, t];
	}
	function renderNav() {
		var nav = document.getElementById('nav'); nav.textContent = '';
		var N = 0, T = 0;
		data.roots.forEach(function (r) {
			var pr = progress(r); N += pr[0]; T += pr[1];
			nav.appendChild(el('button', { 'aria-current': String(r.id === current), onclick: function () { show(r.id); } }, [
				el('span', { text: r.label }), el('span', { class: 'cnt' + (pr[0] === pr[1] ? ' done' : ''), text: pr[0] + '/' + pr[1] })]));
		});
		document.getElementById('status').textContent = 'סומנו ' + N + ' מתוך ' + T + (db ? '' : ' · הסימונים לא נשמרים בתצוגה הזאת') + ' · הנתונים מ-' + data.built;
	}
	function write(coll, id, doc) {
		if (!db) return Promise.resolve();
		return db.collection(coll).doc(id).set(doc).catch(function () {});
	}
	function setWord(e, role, note) {
		var prev = choices[e.id] || {};
		var doc = { role: role, into: '', note: note != null ? note : (prev.note || ''), root: current, at: new Date().toISOString() };
		choices[e.id] = doc; renderNav();
		return write('choices', e.id, doc);
	}
	function setPhrase(r, p, choice) {
		var id = pid(r.id, p.text), cur = phraseChoices[id];
		if (cur && cur.choice === choice) { delete phraseChoices[id]; renderNav(); return db ? db.collection('phrases').doc(id).delete().catch(function () {}) : Promise.resolve(); }
		var doc = { root: r.id, text: p.form, key: p.text, choice: choice, at: new Date().toISOString() };
		phraseChoices[id] = doc; renderNav();
		return write('phrases', id, doc);
	}
	function exLines(list, cls) {
		return (list || []).map(function (x) {
			return el('div', { class: cls || '' }, [x.t ? el('span', { class: 't', text: x.t + ': ' }) : null, x.b || '', el('mark', { text: x.x }), x.f || '']);
		});
	}
	function toggleEx(btn, box) {
		btn.addEventListener('click', function () { box.hidden = !box.hidden; btn.textContent = box.hidden ? 'דוגמאות' : 'להסתיר'; });
	}
	function opts(list, active, onpick) {
		var g = el('div', { class: 'opts', role: 'group' });
		list.forEach(function (o) {
			g.appendChild(el('button', { class: 'opt ' + o[2], 'aria-pressed': String(active === o[0]), onclick: function () { onpick(o[0]); } }, [o[1]]));
		});
		return g;
	}

	// שאלה 1: צירופים
	function phraseBlock(r) {
		var b = el('section', { class: 'block' });
		b.appendChild(el('div', { class: 'q' }, [el('span', { class: 'n', text: '1' }), el('h3', { text: 'אילו צירופים הם בעיה תמיד?' })]));
		b.appendChild(el('p', { class: 'hint', text: 'המילה עם המילה שצמודה אליה, כפי שהם מופיעים בערכים. צירוף שתסמן "בעיה תמיד" ייכנס לתבנית של עוגן. "תמים" - הצירוף לא ייתפס בכלל (למשל "מיני סדרה"). לא חייבים לסמן הכול, רק מה שברור לך.' }));
		if (!r.phrases.length) { b.appendChild(el('p', { class: 'hint', text: 'אין כאן צירופים חוזרים.' })); return b; }
		var t = el('table'), tb = el('tbody');
		t.appendChild(el('thead', {}, [el('tr', {}, [el('th', { text: 'צירוף' }), el('th', { text: 'חסומים' }), el('th', { text: 'ויקיפדיה' }), el('th', { text: 'מכלול' }), el('th', { text: 'סווג: בעייתי' }), el('th', { text: 'תמים' }), el('th', { text: 'מה זה' })])]));
		r.phrases.forEach(function (p) {
			var c = phraseChoices[pid(r.id, p.text)], box = el('div', { class: 'ex', hidden: '' }, exLines(p.ex, ''));
			var more = p.ex.length ? el('button', { class: 'more', text: 'דוגמאות' }) : null;
			if (more) toggleEx(more, box);
			var tr = el('tr', { class: c ? 'decided' : '' }, [
				el('td', { class: 'phrase' }, [p.form, ' ', more, box]),
				el('td', { class: 'num' }, [el('b', { text: String(p.b) })]),
				el('td', { class: 'num', text: String(p.w) }),
				el('td', { class: 'num', text: String(p.m) }),
				el('td', { class: 'num', text: (p.p || p.i) ? String(p.p) : '' }),
				el('td', { class: 'num', text: (p.p || p.i) ? String(p.i) : '' }),
				el('td', {}, [opts([['bad', 'בעיה תמיד', 'bad'], ['ok', 'תמים', 'ok']], c ? c.choice : null, function (ch) { setPhrase(r, p, ch).then(function () { show(current); }); })])
			]);
			tb.appendChild(tr);
		});
		t.appendChild(tb);
		b.appendChild(el('div', { class: 'tbl' }, [t]));
		return b;
	}

	// שאלה 2: המילה לבד
	function wordBlock(r) {
		var words = r.entries.filter(isWord);
		if (!words.length) return null;
		var b = el('section', { class: 'block' });
		b.appendChild(el('div', { class: 'q' }, [el('span', { class: 'n', text: '2' }), el('h3', { text: 'ומה עם המילה כשהיא לבד?' })]));
		b.appendChild(el('p', { class: 'hint', text: 'כשהמילה מופיעה בלי צירוף מפורש. "לפי ההקשר": רמת החשד לפי הנתונים, ועולה כשיש בדף מילים חשודות נוספות. "קבוע": רק לפי הנתונים. הפס: בעייתי (אדום) מול תמים (ירוק) במופעים שסיווגתי.' }));
		words.forEach(function (e) { b.appendChild(wordRow(e, WORD_OPTS)); });
		return b;
	}
	function wordRow(e, list) {
		var role = roleOf(e), w = el('div', { class: 'word' });
		var name = (e.forms && e.forms.length ? e.forms.slice(0, 3).join(' · ') : e.pattern);
		var facts = [];
		if (e.lab && (e.lab.p + e.lab.i)) {
			var n = e.lab.p + e.lab.i + e.lab.u, pct = Math.round(100 * e.lab.p / (e.lab.p + e.lab.i));
			var bar = el('span', { class: 'bar', role: 'img', 'aria-label': pct + '% בעייתי' });
			[['p', e.lab.p], ['i', e.lab.i], ['u', e.lab.u]].forEach(function (s) { if (s[1]) bar.appendChild(el('span', { style: 'width:' + (100 * s[1] / n) + '%;background:var(--' + s[0] + ')' })); });
			facts.push(el('span', { text: pct + '% בעייתי (' + e.lab.p + ' מ-' + (e.lab.p + e.lab.i) + ')' }), bar);
		} else facts.push(el('span', { text: 'אין מופעים מסווגים' }));
		facts.push(el('span', { text: ' · ' + e.hits.b + ' חסומים, ' + e.hits.w + ' בוויקיפדיה, ' + e.hits.m + ' במכלול' }));
		w.appendChild(el('div', { class: 'wtop' }, [el('span', { class: 'wname' }, [name, ' ', el('small', { text: e.id })]), el('span', { class: 'facts' }, facts)]));
		var s = sugg(e);
		w.appendChild(el('div', { class: 'sugg' }, [el('b', { text: 'ההצעה שלי: ' + LABEL[s] + '. ' }), e.why || '']));
		w.appendChild(opts(list, role, function (ch) { setWord(e, ch).then(function () { show(current); }); }));
		var box = el('div', { class: 'ex', hidden: '' });
		if (e.lab && (e.lab.ex.p.length || e.lab.ex.i.length)) {
			exLines(e.lab.ex.p, 'p').concat(exLines(e.lab.ex.i, 'i')).forEach(function (x) { box.appendChild(x); });
		} else exLines(e.hits.ex.w.concat(e.hits.ex.b), '').forEach(function (x) { box.appendChild(x); });
		box.appendChild(el('div', { class: 'pat', text: e.pattern }));
		var note = el('input', { type: 'text', id: 'n-' + e.id, placeholder: 'הערה (לא חובה)' });
		note.value = (choices[e.id] && choices[e.id].note) || '';
		var tm = null;
		note.addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(function () { setWord(e, roleOf(e) || s, note.value); }, 700); });
		var more = el('button', { class: 'more', text: 'דוגמאות' }); toggleEx(more, box);
		w.appendChild(el('div', {}, [more, box]));
		w.appendChild(note);
		return w;
	}

	// שאלה 3: העוגנים הקיימים
	function anchorBlock(r) {
		var anc = r.entries.filter(function (e) { return !isWord(e); });
		if (!anc.length) return null;
		var b = el('section', { class: 'block' });
		var modesty = isModesty(r);
		b.appendChild(el('div', { class: 'q' }, [el('span', { class: 'n', text: modesty ? '3' : '1' }),
			el('h3', { text: modesty ? 'הצירופים שכבר ברשימה כ"בעיה תמיד" - נכון?' : 'מה עושים עם המילים האלה?' })]));
		if (modesty) {
			b.appendChild(el('p', { class: 'hint', text: 'אם זה נכון - לא צריך לעשות כלום. לחיצה על "לא" מעבירה את הצירוף ל"לבדיקה".' }));
			var list = el('div', { class: 'anchors' });
			anc.forEach(function (e) {
				var role = roleOf(e), s = sugg(e), off = role && role !== 'anchor';
				var nm = e.forms && e.forms.length ? e.forms.slice(0, 2).join(' · ') : e.pattern;
				var tag = s === 'merge' ? ' (כפילות - אאחד)' : s === 'drop' ? ' (הצעה: להוריד)' : '';
				list.appendChild(el('span', { class: 'anc' + (off ? ' off' : ''), title: e.pattern + (e.why ? ' - ' + e.why : '') }, [
					nm + tag,
					el('button', { onclick: function () { setWord(e, off ? 'anchor' : 'general').then(function () { show(current); }); } }, [off ? 'להחזיר' : 'לא'])
				]));
			});
			b.appendChild(list);
		} else {
			anc.forEach(function (e) { b.appendChild(wordRow(e, OTHER_OPTS)); });
		}
		return b;
	}

	function show(rootId) {
		current = rootId;
		try { localStorage.setItem('roots-current', rootId); } catch (err) { /* אין אחסון */ }
		var r = data.roots.filter(function (x) { return x.id === rootId; })[0];
		var main = document.getElementById('main');
		var y = window.scrollY, open = {};
		main.querySelectorAll('.ex:not([hidden])').forEach(function (x, i) { open[i] = true; });
		main.textContent = '';
		var head = el('section', { class: 'block' }, [el('h2', { text: r.label }), r.note ? el('p', { class: 'hint', text: r.note }) : null]);
		var rn = el('textarea', { id: 'rn-' + r.id, placeholder: 'הערה על השורש כולו: מילה שחסרה, צירוף שלא מופיע כאן…' });
		rn.value = (rootNotes[r.id] && rootNotes[r.id]) || '';
		var t = null;
		rn.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { rootNotes[r.id] = rn.value; write('rootnotes', r.id, { note: rn.value, at: new Date().toISOString() }); }, 700); });
		head.appendChild(rn);
		main.appendChild(head);
		if (isModesty(r)) main.appendChild(phraseBlock(r));
		var wb = isModesty(r) ? wordBlock(r) : null; if (wb) main.appendChild(wb);
		var ab = anchorBlock(r); if (ab) main.appendChild(ab);
		main.querySelectorAll('.ex').forEach(function (x, i) { if (open[i]) { x.hidden = false; } });
		window.scrollTo(0, y);
		renderNav();
	}

	fetch('roots-data.json').then(function (r) { return r.json(); }).then(function (d) {
		data = d;
		var saved = null;
		try { saved = localStorage.getItem('roots-current'); } catch (err) { /* אין אחסון */ }
		show(data.roots.some(function (r) { return r.id === saved; }) ? saved : data.roots[0].id);
		if (window.claude && window.claude.use) {
			window.claude.use('db').then(function (x) {
				if (!x) return;
				db = x;
				var busy = function () { var a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); };
				db.collection('choices').onSnapshot(function (snap) {
					var next = {}; snap.docs.forEach(function (doc) { next[doc.id] = doc.data(); }); choices = next;
					if (busy()) renderNav(); else show(current);
				}, function () {});
				db.collection('phrases').onSnapshot(function (snap) {
					var next = {}; snap.docs.forEach(function (doc) { next[doc.id] = doc.data(); }); phraseChoices = next;
					if (busy()) renderNav(); else show(current);
				}, function () {});
				db.collection('rootnotes').onSnapshot(function (snap) {
					snap.docs.forEach(function (doc) { rootNotes[doc.id] = doc.data().note || ''; });
					var ta = document.getElementById('rn-' + current);
					if (ta && document.activeElement !== ta) ta.value = rootNotes[current] || '';
				}, function () {});
			});
		}
	}).catch(function () {
		document.getElementById('main').innerHTML = '<p class="empty">הנתונים לא נטענו. נסו לרענן את הדף.</p>';
	});
})();
</script>
